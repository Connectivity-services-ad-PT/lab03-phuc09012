openapi: 3.1.0
info:
  title: Smart Campus — AI Vision API
  version: 0.3.0
  description: Contract mock tối thiểu cho phân hệ AI Vision (FIT4110 Lab 03)
servers:
  - url: http://localhost:4011
    description: Prism mock server for AI Vision
paths:
  /health:
    get:
      summary: Kiểm tra trạng thái hệ thống
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /detect:
    post:
      summary: Phát hiện đối tượng trong ảnh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [camera_id]
              properties:
                camera_id:
                  type: string
                  example: CAM01
                image_url:
                  type: string
                  format: uri
                  example: https://example.com/frame.jpg
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        "400":
          description: Lỗi dữ liệu đầu vào