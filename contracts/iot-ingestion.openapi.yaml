openapi: 3.1.0
info:
  title: Smart Campus — IoT Ingestion API
  version: 0.3.0
  description: Contract mock cho phân hệ IoT Ingestion (FIT4110 Lab 03)
servers:
  - url: http://0.0.0.0:4010
    description: Prism mock server for IoT Ingestion
tags:
  - name: system
    description: Health endpoints
  - name: iot
    description: Ingestion endpoints
paths:
  /health:
    get:
      tags: [system]
      summary: Kiểm tra trạng thái hệ thống
      description: Kiểm tra xem service iot ingestion đã chạy chưa.
      operationId: getIotHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /readings:
    post:
      tags: [iot]
      summary: Nhận dữ liệu từ thiết bị IoT
      description: Gửi dữ liệu nhiệt độ từ cảm biến lên hệ thống.
      operationId: createReading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  example: dev-001
                temperature:
                  type: number
                  example: 25.5
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: success
        "400":
          description: Lỗi dữ liệu đầu vào