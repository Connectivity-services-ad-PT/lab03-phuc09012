openapi: 3.1.0
info:
  title: Smart Campus — IoT Ingestion API
  version: 0.3.0
  description: Contract mock tối thiểu cho phân hệ IoT Ingestion (FIT4110 Lab 03)
servers:
  - url: http://localhost:4010
    description: Prism mock server for IoT Ingestion
paths:
  /health:
    get:
      summary: Kiểm tra trạng thái hệ thống
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readings:
    post:
      summary: Nhận dữ liệu từ thiết bị IoT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  example: dev-001
                temperature:
                  type: number
                  example: 25.5
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        "400":
          description: Lỗi dữ liệu đầu vào